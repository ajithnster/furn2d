<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Showroom Quotes</title>
<style>
  :root { --bg: #f6f3ee; --panel: #fff; --ink: #2b2722; --muted: #7a7268; --line: #e4ded5; --chip: #f1ece5; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  input { font: inherit; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 240px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--chip); }
  tr.q { cursor: pointer; } tr.q:hover td { background: #faf8f4; }
  .num { font-weight: 600; white-space: nowrap; } .r { text-align: right; white-space: nowrap; }
  .detail td { background: #fbfaf7; }
  .lines { width: 100%; font-size: 13px; } .lines td, .lines th { padding: 6px 8px; background: none; }
  .muted { color: var(--muted); font-size: 12px; }
  a { color: inherit; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  @media (max-width: 760px) { .hide-sm { display: none; } input { min-width: 0; width: 100%; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Showroom quotes</h1>
  <div class="sub">Quotes customers confirmed in the room composer and House plan. Click a quote for its items.</div>
  <div class="bar"><input id="search" type="search" placeholder="Search name, email, quote number, product…" aria-label="Search quotes"><span class="muted" id="count"></span></div>
  <div class="card"><table>
    <thead><tr><th>Quote</th><th>Date</th><th>Customer</th><th class="hide-sm">Contact</th><th class="r">Items</th><th class="r">Total</th><th class="hide-sm">From</th></tr></thead>
    <tbody id="rows"><tr><td colspan="7" class="empty">Loading…</td></tr></tbody>
  </table></div>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n, c = 'USD') => new Intl.NumberFormat('en-US', { style: 'currency', currency: c, maximumFractionDigits: 0 }).format(n);
let quotes = [], open = null;
function render() {
  const q = $('#search').value.trim().toLowerCase();
  const list = quotes.filter(x => !q || JSON.stringify([x.number, x.contact, x.lines.map(l => l.name + ' ' + l.code)]).toLowerCase().includes(q));
  $('#count').textContent = `${list.length} of ${quotes.length} quote${quotes.length === 1 ? '' : 's'}`;
  const rows = [];
  for (const x of list) {
    const items = x.lines.reduce((s, l) => s + l.qty, 0);
    rows.push(`<tr class="q" data-n="${esc(x.number)}"><td class="num">${esc(x.number)}</td><td>${esc(new Date(x.createdAt).toLocaleString())}</td>
      <td>${esc(x.contact.name)}</td><td class="hide-sm"><a href="mailto:${esc(x.contact.email)}?subject=${encodeURIComponent('Your Verona quote ' + x.number)}">${esc(x.contact.email)}</a><br><span class="muted">${esc(x.contact.phone)}</span></td>
      <td class="r">${items}</td><td class="r">${money(x.subtotal, x.currency)}</td><td class="hide-sm">${esc(x.source === 'houseplan' ? 'House plan' : x.source === 'composer' ? 'Room composer' : x.source)}</td></tr>`);
    if (open === x.number) rows.push(`<tr class="detail"><td colspan="7">
      <table class="lines"><thead><tr><th>Product</th><th>Option</th><th>IDs</th><th class="r">Unit</th><th class="r">Qty</th><th class="r">Total</th></tr></thead><tbody>
      ${x.lines.map(l => `<tr><td><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)}</a></td><td>${esc(l.variant || '—')}</td>
        <td class="muted">${esc(l.code)} · product ${esc(l.productId)} · variant ${esc(l.variantId)}${l.sku ? ' · SKU ' + esc(l.sku) : ''}</td>
        <td class="r">${money(l.unitPrice, x.currency)}</td><td class="r">${l.qty}</td><td class="r">${money(l.lineTotal, x.currency)}</td></tr>`).join('')}
      </tbody></table>
      <p class="muted">Valid until ${esc(x.validUntil)} · prices as of ${esc(x.pricesAsOf)}${x.contact.notes ? ' · Notes: ' + esc(x.contact.notes) : ''}</p></td></tr>`);
  }
  $('#rows').innerHTML = rows.join('') || '<tr><td colspan="7" class="empty">No quotes yet.</td></tr>';
}
$('#rows').onclick = e => { const tr = e.target.closest('tr.q'); if (!tr || e.target.closest('a')) return; open = open === tr.dataset.n ? null : tr.dataset.n; render(); };
$('#search').oninput = render;
fetch('../api/quotes', { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(d => { quotes = d; render(); })
  .catch(s => { $('#rows').innerHTML = `<tr><td colspan="7" class="empty">Could not load quotes (${esc(s)}).</td></tr>`; });
</script>
</body>
</html>
